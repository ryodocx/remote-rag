services:
  mcp-server:
    build: ../server/core
    container_name: mcp-server
    volumes:
      # マウント設定: ホスト側のデータをコンテナに引き継ぐ
      - ../data:/app/data
      # HuggingFaceのモデルダウンロードキャッシュをホストと共有（起動ごとの再ダウンロード防止）
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: python -m src.mcp_server.server --transport sse --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1

  ingest-api:
    build: ../server/core
    container_name: ingest-api
    volumes:
      - ../data:/app/data
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: uvicorn src.api.ingest_api:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - INGEST_API_KEY=${INGEST_API_KEY:-default_secret_key}

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - auth-helper
      - mcp-server

  redis:
    image: redis:7-alpine
    container_name: redis-cache

  auth-helper:
    build:
      context: ../server/auth-helper
    container_name: auth-helper
    environment:
      # CACHE_TYPE: redis or memory
      - CACHE_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OAUTH_INTROSPECT_URL=${OAUTH_INTROSPECT_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
    depends_on:
      - redis

volumes:
  huggingface_cache:
