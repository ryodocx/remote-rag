services:
  rrag-server:
    build: ../server/core
    container_name: rrag-server
    volumes:
      # マウント設定: ホスト側のデータをコンテナに引き継ぐ
      - ../data:/app/data
      # HuggingFaceのモデルダウンロードキャッシュをホストと共有（起動ごとの再ダウンロード防止）
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: python -m src.entrypoint
    ports:
      - "127.0.0.1:8000:8000"  # 統合サーバー (REST API, Ingest API, MCP)
      - "8002:8002"            # Metrics
    environment:
      - PYTHONUNBUFFERED=1
      - WIKI_SEARCH_MAX_TOKENS=${WIKI_SEARCH_MAX_TOKENS:-4000}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    container_name: caddy-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - AUTH_EXPECTED_AUD=${AUTH_EXPECTED_AUD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-helper
      - rrag-server

  valkey:
    profiles:
      - caddy
    image: valkey/valkey:8-alpine
    container_name: valkey-cache

  auth-helper:
    profiles:
      - caddy
    build:
      context: ../server/auth-helper
    container_name: auth-helper
    environment:
      # CACHE_TYPE: redis or memory (Valkey is fully redis-compatible)
      - CACHE_TYPE=redis
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - OAUTH_VALIDATION_MODE=${OAUTH_VALIDATION_MODE:-jwks}
      - AUTH_INTROSPECT_CACHE_TTL_SECONDS=${AUTH_INTROSPECT_CACHE_TTL_SECONDS:-60}
      - OAUTH_INTROSPECT_URL=${OAUTH_INTROSPECT_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_JWKS_URL=${OAUTH_JWKS_URL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8005:8000" # Auth Helper Metrics / API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - valkey

  oathkeeper:
    profiles:
      - oathkeeper
    image: oryd/oathkeeper:v0.40.7-alpine
    container_name: oathkeeper-proxy
    ports:
      - "8080:8080"  # Ingress port matching Caddy
      - "4456:4456"  # API/Metrics port
    volumes:
      - ./oathkeeper.yml:/etc/config/oathkeeper/oathkeeper.yml
      - ./rules.json.template:/etc/config/oathkeeper/rules.json.template
      - oathkeeper_generated_rules:/etc/config/oathkeeper/generated
    environment:
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - AUTH_EXPECTED_AUD=${AUTH_EXPECTED_AUD:-}
      - OAUTH_INTROSPECT_URL=${OAUTH_INTROSPECT_URL:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_JWKS_URL=${OAUTH_JWKS_URL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c '
      sed -e "s|\$$OAUTH_CLIENT_ID|$${OAUTH_CLIENT_ID}|g" \
          -e "s|\$$AUTH_EXPECTED_AUD|$${AUTH_EXPECTED_AUD}|g" \
          /etc/config/oathkeeper/rules.json.template > /etc/config/oathkeeper/generated/rules.json && \
      oathkeeper serve --config /etc/config/oathkeeper/oathkeeper.yml
      '
    depends_on:
      - rrag-server

volumes:
  huggingface_cache:
  oathkeeper_generated_rules:
