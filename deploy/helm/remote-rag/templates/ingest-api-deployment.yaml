apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remote-rag.fullname" . }}-ingest-api
  labels:
    app.kubernetes.io/name: {{ include "remote-rag.name" . }}-ingest-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "remote-rag.name" . }}-ingest-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "remote-rag.name" . }}-ingest-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "remote-rag.serviceAccountName" . }}
      containers:
        - name: ingest-api
          image: "{{ .Values.ingestApi.image.repository }}:{{ .Values.ingestApi.image.tag }}"
          imagePullPolicy: {{ .Values.ingestApi.image.pullPolicy }}
          command: ["uvicorn", "src.api.ingest_api:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $key, $value := .Values.ingestApi.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

