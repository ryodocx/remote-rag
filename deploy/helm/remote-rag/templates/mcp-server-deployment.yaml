apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remote-rag.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          command: ["python", "-m", "src.mcp_server.server", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: huggingface-cache
              mountPath: /home/appuser/.cache/huggingface
      volumes:
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "remote-rag.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: huggingface-cache
          {{- if .Values.persistence.huggingface.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "remote-rag.fullname" . }}-huggingface
          {{- else }}
          emptyDir: {}
          {{- end }}
