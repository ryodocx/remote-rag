apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remote-rag.fullname" . }}-mcp-server
  labels:
    app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "remote-rag.name" . }}-mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "remote-rag.serviceAccountName" . }}
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          command: ["python", "-m", "src.mcp_server.server", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            {{- range $key, $value := .Values.mcpServer.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

