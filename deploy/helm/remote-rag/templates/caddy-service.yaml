{{- if .Values.caddy.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "remote-rag.fullname" . }}-caddy
  labels:
    app.kubernetes.io/name: {{ include "remote-rag.name" . }}-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.caddy.service.type }}
  ports:
    - port: {{ .Values.caddy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "remote-rag.name" . }}-caddy
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
