serve:
  proxy:
    port: 8080
    host: 0.0.0.0
  api:
    port: 4456
    host: 0.0.0.0

errors:
  fallback:
    - json
  handlers:
    json:
      enabled: true
      config:
        verbose: true

access_rules:
  repositories:
    - file:///etc/config/oathkeeper/generated/rules.json

authenticators:
  noop:
    enabled: true
  
  oauth2_introspection:
    enabled: true
    config:
      introspection_url: http://localhost:8000/placeholder
      cache:
        enabled: true
        ttl: 60s

  jwt:
    enabled: true
    config:
      jwks_urls:
        - http://localhost:8000/placeholder

authorizers:
  allow:
    enabled: true

mutators:
  noop:
    enabled: true
