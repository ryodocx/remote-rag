name: Publish Containers and Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_CORE: ${{ github.repository }}-core
  IMAGE_NAME_AUTH: ${{ github.repository }}-auth-helper

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Core
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CORE }}

      - name: Build and push Core image
        uses: docker/build-push-action@v5
        with:
          context: ./server/core
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}

      - name: Extract metadata (tags, labels) for Auth Helper
        id: meta-auth
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AUTH }}

      - name: Build and push Auth Helper image
        uses: docker/build-push-action@v5
        with:
          context: ./server/auth-helper
          push: true
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}

  publish-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          CHART_VERSION=$(grep "^version:" deploy/helm/remote-rag/Chart.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
            sed -i "s/^version:.*/version: ${CHART_VERSION}/" deploy/helm/remote-rag/Chart.yaml
          fi
          helm package deploy/helm/remote-rag --version ${CHART_VERSION}

      - name: Push Helm chart to GHCR
        run: |
          CHART_VERSION=$(grep "^version:" deploy/helm/remote-rag/Chart.yaml | awk '{print $2}')
          helm push remote-rag-${CHART_VERSION}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
